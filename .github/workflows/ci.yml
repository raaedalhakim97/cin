name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint (ratchet)
        # `npm run lint` exits 1 today: the repo carries 68 pre-existing
        # react-hooks findings. A gate that fails every build trains everyone to
        # ignore CI, so this fails only when the count GROWS, and always on a
        # parse error. Lower .eslint-baseline as findings get fixed.
        run: node scripts/lint-ratchet.mjs

      - name: Build
        # The real gate: a broken import, bad JSX or a missing export fails here.
        # Every fix this session was verified with a green build.
        run: npm run build
        env:
          # Build-time only. The app reads these at runtime from the host's
          # environment; these placeholders just satisfy the bundler.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Fail if source maps leak into the bundle
        # Source maps would publish the entire frontend source, including every
        # table and column name, to anyone who opens devtools.
        run: |
          if find dist -name '*.map' | grep -q .; then
            echo "::error::source maps found in dist/ — they must not ship"
            find dist -name '*.map'
            exit 1
          fi
          echo "no source maps in dist/"

      - name: Fail if a credential got committed
        run: ./scripts/check-secrets.sh

  mobile:
    name: Mobile — compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
        working-directory: mobile

      - name: Compile every screen and library
        # There is no bundler step cheap enough for CI here, but Babel will
        # reject a syntax error or bad JSX in any file, which is the failure
        # class that actually happens.
        working-directory: mobile
        run: |
          node -e "
            const babel = require('@babel/core');
            const fs = require('fs'), path = require('path');
            const preset = require.resolve('babel-preset-expo');
            let checked = 0, failed = 0;
            const walk = (d) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, e.name);
                if (e.isDirectory()) { if (e.name !== 'node_modules') walk(p); continue; }
                if (!/\.(js|jsx)$/.test(e.name)) continue;
                checked++;
                try {
                  babel.transformSync(fs.readFileSync(p, 'utf8'),
                    { filename: p, presets: [preset], babelrc: false, configFile: false });
                } catch (err) {
                  failed++;
                  console.error('FAIL ' + p + ': ' + err.message.split('\n')[0]);
                }
              }
            };
            walk('app'); walk('src');
            console.log(checked + ' files checked, ' + failed + ' failed');
            process.exit(failed ? 1 : 0);
          "

      - name: Validate app and build config
        working-directory: mobile
        run: |
          node -e "
            const app = require('./app.json').expo;
            const eas = require('./eas.json');
            const need = ['ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION'];
            const have = app.android.permissions || [];
            const missing = need.filter(p => !have.includes(p));
            if (missing.length) {
              console.error('::error::android permissions missing: ' + missing.join(', ') +
                            ' — clock-in needs GPS and will fail silently without them');
              process.exit(1);
            }
            if (eas.build.preview.android.buildType !== 'apk') {
              console.error('::error::the preview profile must build an apk, not an aab');
              process.exit(1);
            }
            console.log('app.json permissions ok; preview profile builds an apk');
          "
