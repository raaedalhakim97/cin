name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job, not two.
#
# The first version split web and mobile into parallel jobs, which asks GitHub
# for two runners at once. On the first real run both sat unscheduled and were
# killed after 20 and 15 minutes — runner_id 0, no logs at all, nothing billed.
# Not a test failure: nothing ever executed. The actual work here is about four
# minutes, so parallelism buys almost nothing and doubles the exposure to
# runner scarcity.
jobs:
  ci:
    name: Lint, build and compile
    runs-on: ubuntu-latest
    # A hung step should fail loudly and quickly, not burn the default six hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ── Web ────────────────────────────────────────────────────────────────
      - name: Install web dependencies
        run: npm ci

      - name: Lint (ratchet)
        # `npm run lint` exits 1 today: the repo carries 68 pre-existing
        # react-hooks findings. A gate that fails every build trains everyone to
        # ignore CI, so this fails only when the count GROWS, and always on a
        # parse error. Lower .eslint-baseline as findings get fixed.
        run: node scripts/lint-ratchet.mjs

      - name: Build
        # The real gate: a broken import, bad JSX or a missing export fails here.
        run: npm run build
        env:
          # Build-time only. The deployed app reads these from the host's
          # environment; these placeholders just satisfy the bundler.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Fail if source maps leak into the bundle
        # Source maps would publish the entire frontend source, including every
        # table and column name, to anyone who opens devtools.
        run: |
          if find dist -name '*.map' | grep -q .; then
            echo "::error::source maps found in dist/ — they must not ship"
            find dist -name '*.map'
            exit 1
          fi
          echo "no source maps in dist/"

      - name: Fail if a credential got committed
        run: ./scripts/check-secrets.sh

      # ── Mobile ─────────────────────────────────────────────────────────────
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Compile every screen and library
        # No bundler step is cheap enough for CI here, but Babel rejects a
        # syntax error or bad JSX in any file, which is the failure class that
        # actually happens. Extracted to a script so it can be run locally with
        # the same code CI runs, rather than living as YAML-escaped JavaScript.
        working-directory: mobile
        run: node ../scripts/compile-check.mjs

      - name: Validate app and build config
        working-directory: mobile
        run: node ../scripts/check-mobile-config.mjs
